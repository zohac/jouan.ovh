<!-- @dsCard group="Type" viewport="700x150" name="Eyebrows & labels" subtitle="Uppercase mono with wide tracking — terminal idioms" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-mono);
    padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-6) var(--space-8);
    align-items: center; }
  .eyebrow { font-size: var(--fs-xs); letter-spacing: var(--ls-wider); text-transform: uppercase; }
  .accent { color: var(--accent); }
  .muted { color: var(--text-muted); }
  .path { color: var(--term-blue); }
</style>
</head>
<body>
  <span class="eyebrow accent">// CE QUE JE FAIS</span>
  <span class="eyebrow muted"># SERVICES</span>
  <span class="eyebrow path">~/À-PROPOS</span>
  <span class="eyebrow muted">01 — INTRO</span>
</body>
</html>
