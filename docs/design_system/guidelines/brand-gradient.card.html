<!-- @dsCard group="Brand" viewport="700x240" name="Heritage gradient" subtitle="Aubergine → orange → red — the signature backdrop" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); padding: 0; }
  .grad {
    height: 240px; display: flex; align-items: flex-end; padding: var(--space-6);
    box-sizing: border-box;
    background:
      linear-gradient(127deg, var(--aubergine-deep), transparent 70%),
      linear-gradient(217deg, var(--orange-600), transparent 70%),
      linear-gradient(0deg, var(--term-red), transparent 70%),
      var(--surface-0);
  }
  .cap { font-family: var(--font-mono); color: var(--ink-1); font-size: var(--fs-sm);
    background: hsl(320 60% 3% / 0.5); padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm); backdrop-filter: blur(4px); }
</style>
</head>
<body>
  <div class="grad"><span class="cap">// gradient héritage — aubergine · orange · rouge</span></div>
</body>
</html>
