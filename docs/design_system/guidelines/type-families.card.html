<!-- @dsCard group="Type" viewport="700x230" name="Type families" subtitle="Ubuntu Mono (signature) + Ubuntu sans (body)" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); color: var(--text-strong);
    padding: var(--space-6); }
  .block { margin-bottom: var(--space-5); }
  .lbl { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: var(--ls-wider);
    text-transform: uppercase; color: var(--text-muted); margin-bottom: var(--space-2); }
  .mono { font-family: var(--font-mono); font-size: var(--fs-2xl); }
  .sans { font-family: var(--font-sans); font-size: var(--fs-lg); color: var(--text-body);
    line-height: var(--lh-relaxed); }
  .glyphs { font-family: var(--font-mono); color: var(--text-faint); font-size: var(--fs-sm);
    margin-top: var(--space-2); }
</style>
</head>
<body>
  <div class="block">
    <div class="lbl">// Ubuntu Mono — signature</div>
    <div class="mono">Développeur freelance — anon.@jouan.ovh:~$</div>
    <div class="glyphs">ABCDEFG abcdefg 0123456789 {} [] /\ &lt;&gt; =&gt; #_~$</div>
  </div>
  <div class="block">
    <div class="lbl">Ubuntu sans — body</div>
    <div class="sans">Je conçois des applications sur-mesure et des sites WordPress, et j'intègre l'IA dans vos outils du quotidien.</div>
  </div>
</body>
</html>
