<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display → caption, mono-led" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); color: var(--text-strong);
    font-family: var(--font-mono); padding: var(--space-6); }
  .line { display: flex; align-items: baseline; gap: var(--space-4); margin-bottom: var(--space-3); }
  .line span:last-child { font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--text-faint); }
  .sample { line-height: var(--lh-tight); white-space: nowrap; }
</style>
</head>
<body>
  <div class="line"><span class="sample" style="font-size:var(--fs-5xl);font-weight:var(--fw-light)">Simon Jouan</span><span>48 · display</span></div>
  <div class="line"><span class="sample" style="font-size:var(--fs-3xl)">Titre de section</span><span>32 · 3xl</span></div>
  <div class="line"><span class="sample" style="font-size:var(--fs-2xl)">Sous-titre</span><span>28 · 2xl</span></div>
  <div class="line"><span class="sample" style="font-size:var(--fs-xl)">Heading large</span><span>24 · xl</span></div>
  <div class="line"><span class="sample" style="font-size:var(--fs-md);font-family:var(--font-sans);color:var(--text-body)">Corps de texte en Ubuntu sans</span><span>18 · md</span></div>
  <div class="line"><span class="sample" style="font-size:var(--fs-sm);color:var(--text-muted)">Caption / légende</span><span>14 · sm</span></div>
</body>
</html>
