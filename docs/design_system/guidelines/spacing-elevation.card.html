<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Deep dark shadows + lit-from-above hairline; focal glows" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-mono);
    padding: var(--space-8) var(--space-6); display: flex; gap: var(--space-6);
    align-items: center; }
  .sw { text-align: center; font-size: var(--fs-xs); color: var(--text-muted); }
  .box { width: 110px; height: 64px; background: var(--bg-card); border-radius: var(--radius-md);
    margin-bottom: var(--space-3); border: 1px solid var(--border-subtle); }
  .sw b { color: var(--text-strong); display: block; }
</style>
</head>
<body>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-1),var(--shadow-hairline)"></div><b>shadow-1</b></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-2),var(--shadow-hairline)"></div><b>shadow-2</b></div>
  <div class="sw"><div class="box" style="box-shadow:var(--shadow-4),var(--shadow-hairline)"></div><b>shadow-4</b></div>
  <div class="sw"><div class="box" style="box-shadow:var(--glow-accent)"></div><b>glow-accent</b></div>
</body>
</html>
