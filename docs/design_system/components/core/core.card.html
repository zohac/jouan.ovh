<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--bg-page); color: var(--text-body);
    font-family: var(--font-mono); padding: var(--space-6); }
  .sec { margin-bottom: var(--space-6); }
  .lbl { font-size: var(--fs-xs); letter-spacing: var(--ls-wider); text-transform: uppercase;
    color: var(--text-muted); margin-bottom: var(--space-3); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); align-items: start; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Badge, Tag, Card, Input, Avatar } = window.JouanOvhDesignSystem_c7aa28;
const Sec = ({label, children}) => (
  <div className="sec"><div className="lbl">{label}</div>{children}</div>
);
function Demo() {
  return (
    <div>
      <Sec label="// Badges & Tags">
        <div className="row" style={{marginBottom:'12px'}}>
          <Badge tone="success" dot>Disponible</Badge>
          <Badge tone="accent">WordPress</Badge>
          <Badge tone="info">Nest.js</Badge>
          <Badge tone="warning">Beta</Badge>
          <Badge tone="danger">Archivé</Badge>
          <Badge tone="neutral">Draft</Badge>
        </div>
        <div className="row">
          <Tag>wordpress</Tag><Tag>symfony</Tag><Tag>nuxt</Tag>
          <Tag onRemove={()=>{}}>react</Tag>
        </div>
      </Sec>
      <Sec label="// Input">
        <Input label="Email" type="email" placeholder="vous@exemple.com" required />
      </Sec>
      <Sec label="// Avatars">
        <div className="row">
          <Avatar src="../../assets/brand/portrait.jpeg" alt="Simon" size="sm" />
          <Avatar src="../../assets/brand/portrait.jpeg" alt="Simon" size="md" />
          <Avatar src="../../assets/brand/portrait.jpeg" alt="Simon" size="lg" ring />
          <Avatar initials="SJ" size="md" />
        </div>
      </Sec>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
